<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="noise"></div>
<div class="transition-overlay" id="transitionOverlay">
  <div class="transition-rule"></div>
</div>
<div class="container">

  <div class="launch-state" id="launchState">
    <div class="masthead">
      <h1 class="title">Daily Briefing</h1>
      <div class="masthead-date" id="mastheadDate"></div>
    </div>
    <button class="generate-btn" id="generateBtn" onclick="generate()">Print Edition</button>
  </div>

  <div class="loading-state" id="loadingState">
    <svg class="route-canvas" id="routeCanvas" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="loading-status" id="loadingStatus">Delivering your edition...</div>
  </div>

  <div class="briefing-state" id="briefingState">
    <div class="briefing-header">
      <div class="briefing-date" id="briefingDate"></div>
      <h1 class="briefing-title">Daily Briefing</h1>
      <div class="briefing-meta" id="briefingMeta"></div>
    </div>
    <div class="section-content" id="mainBriefing"></div>
    <div class="section-content" id="sourcePanel"></div>
    <button class="reset-btn" onclick="reset()">&#8592; New Edition</button>
  </div>

  <div class="error-state" id="errorState">
    <div class="missing-poster">
      <div class="poster-inner">
        <div class="poster-title">MISSING</div>
        <svg class="poster-sketch" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="40" cy="24" r="14" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
          <path d="M26 21 Q40 12 54 21" stroke="#1a1a1a" stroke-width="1.5" fill="#1a1a1a"/>
          <line x1="24" y1="21" x2="56" y2="21" stroke="#1a1a1a" stroke-width="1.5"/>
          <circle cx="34" cy="26" r="1.5" fill="#1a1a1a"/>
          <circle cx="46" cy="26" r="1.5" fill="#1a1a1a"/>
          <path d="M36 32 Q40 35 44 32" stroke="#1a1a1a" stroke-width="1" fill="none"/>
          <line x1="40" y1="38" x2="40" y2="60" stroke="#1a1a1a" stroke-width="1.5"/>
          <line x1="40" y1="46" x2="28" y2="54" stroke="#1a1a1a" stroke-width="1.5"/>
          <line x1="40" y1="46" x2="52" y2="54" stroke="#1a1a1a" stroke-width="1.5"/>
          <rect x="50" y="50" width="10" height="7" rx="1" stroke="#1a1a1a" stroke-width="1" fill="none"/>
          <line x1="52" y1="53" x2="58" y2="53" stroke="#1a1a1a" stroke-width="0.6"/>
          <line x1="52" y1="55" x2="58" y2="55" stroke="#1a1a1a" stroke-width="0.6"/>
          <line x1="40" y1="60" x2="30" y2="78" stroke="#1a1a1a" stroke-width="1.5"/>
          <line x1="40" y1="60" x2="50" y2="78" stroke="#1a1a1a" stroke-width="1.5"/>
        </svg>
        <div class="poster-label">Newspaper Boy</div>
        <div class="poster-sub">Last seen: delivering your edition</div>
      </div>
    </div>
    <p class="error-headline" id="errorHeadline"></p>
    <button class="reset-btn" onclick="reset()" style="margin-top:32px;">&#8592; Try Again</button>
  </div>

</div>

<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="drawings.js"></script>
<script src="script.js"></script>
</body>
</html>
